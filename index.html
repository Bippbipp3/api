<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Clinical Q&A</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0f1a;
    --surface: #111827;
    --surface-2: #1a2236;
    --border: #1e293b;
    --text: #e2e8f0;
    --text-dim: #94a3b8;
    --text-muted: #64748b;
    --accent: #38bdf8;
    --accent-dim: #0c4a6e;
    --user-bg: #172554;
    --assistant-bg: #111827;
    --error: #f87171;
    --success: #34d399;
    --radius: 12px;
    --font: 'IBM Plex Sans KR', -apple-system, sans-serif;
    --mono: 'JetBrains Mono', monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body, #root {
    height: 100%;
    width: 100%;
    overflow: hidden;
  }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    font-size: 15px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  /* Layout */
  .app {
    display: flex;
    flex-direction: column;
    height: 100%;
    max-width: 800px;
    margin: 0 auto;
  }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
  }
  .header-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: -0.01em;
  }
  .header-title span {
    color: var(--accent);
    font-weight: 400;
  }
  .header-actions {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .header-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 6px 10px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 12px;
    font-family: var(--font);
    transition: all 0.15s;
  }
  .header-btn:hover {
    border-color: var(--text-muted);
    color: var(--text);
  }
  .key-status {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--error);
    flex-shrink: 0;
  }
  .key-status.active { background: var(--success); }

  /* Messages */
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    scroll-behavior: smooth;
  }
  .messages::-webkit-scrollbar { width: 4px; }
  .messages::-webkit-scrollbar-track { background: transparent; }
  .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .msg {
    max-width: 88%;
    padding: 10px 14px;
    border-radius: var(--radius);
    font-size: 14px;
    line-height: 1.7;
    word-break: break-word;
    animation: fadeIn 0.2s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg.user {
    align-self: flex-end;
    background: var(--user-bg);
    border: 1px solid #1e3a6e;
    color: #c7d9f5;
  }
  .msg.assistant {
    align-self: flex-start;
    background: var(--surface-2);
    border: 1px solid var(--border);
  }
  .msg.error {
    align-self: center;
    background: rgba(248, 113, 113, 0.08);
    border: 1px solid rgba(248, 113, 113, 0.2);
    color: var(--error);
    font-size: 13px;
    max-width: 95%;
  }

  /* Markdown-ish rendering */
  .msg.assistant p { margin-bottom: 8px; }
  .msg.assistant p:last-child { margin-bottom: 0; }
  .msg.assistant code {
    font-family: var(--mono);
    font-size: 12.5px;
    background: rgba(56, 189, 248, 0.08);
    padding: 1px 5px;
    border-radius: 4px;
    color: var(--accent);
  }
  .msg.assistant pre {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    margin: 8px 0;
    overflow-x: auto;
    font-size: 12.5px;
    line-height: 1.5;
  }
  .msg.assistant pre code {
    background: none;
    padding: 0;
    color: var(--text-dim);
  }
  .msg.assistant strong { color: #f1f5f9; font-weight: 600; }
  .msg.assistant ul, .msg.assistant ol {
    margin: 6px 0 6px 18px;
  }
  .msg.assistant li { margin-bottom: 3px; }
  .msg.assistant h1, .msg.assistant h2, .msg.assistant h3 {
    font-size: 14px;
    font-weight: 600;
    margin: 10px 0 4px;
    color: #f1f5f9;
  }
  .msg.assistant blockquote {
    border-left: 2px solid var(--accent-dim);
    padding-left: 10px;
    margin: 6px 0;
    color: var(--text-dim);
  }
  .msg.assistant table {
    border-collapse: collapse;
    margin: 8px 0;
    font-size: 13px;
    width: 100%;
  }
  .msg.assistant th, .msg.assistant td {
    border: 1px solid var(--border);
    padding: 5px 8px;
    text-align: left;
  }
  .msg.assistant th {
    background: var(--bg);
    font-weight: 500;
  }

  /* Typing indicator */
  .typing {
    display: flex;
    gap: 4px;
    padding: 14px 18px;
    align-self: flex-start;
  }
  .typing span {
    width: 6px;
    height: 6px;
    background: var(--text-muted);
    border-radius: 50%;
    animation: blink 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink {
    0%, 60%, 100% { opacity: 0.3; }
    30% { opacity: 1; }
  }

  /* Input area */
  .input-area {
    padding: 12px 16px;
    border-top: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
  }
  .input-row {
    display: flex;
    gap: 8px;
    align-items: flex-end;
  }
  .input-row textarea {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    color: var(--text);
    font-family: var(--font);
    font-size: 14px;
    line-height: 1.5;
    resize: none;
    min-height: 42px;
    max-height: 160px;
    outline: none;
    transition: border-color 0.15s;
  }
  .input-row textarea:focus {
    border-color: var(--accent-dim);
  }
  .input-row textarea::placeholder {
    color: var(--text-muted);
  }
  .send-btn {
    width: 42px;
    height: 42px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: var(--bg);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: opacity 0.15s;
  }
  .send-btn:disabled {
    opacity: 0.3;
    cursor: not-allowed;
  }
  .send-btn svg {
    width: 18px;
    height: 18px;
  }
  .token-info {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 6px;
    text-align: right;
    font-family: var(--mono);
  }

  /* Modal overlay */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 16px;
    animation: fadeIn 0.15s ease;
  }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    width: 100%;
    max-width: 420px;
  }
  .modal h3 {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 4px;
  }
  .modal p {
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 16px;
  }
  .modal input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    outline: none;
    margin-bottom: 8px;
  }
  .modal input:focus { border-color: var(--accent-dim); }
  .modal-actions {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
    margin-top: 16px;
  }
  .modal-actions button {
    padding: 8px 16px;
    border-radius: 8px;
    border: none;
    font-family: var(--font);
    font-size: 13px;
    cursor: pointer;
  }
  .btn-cancel {
    background: var(--surface-2);
    color: var(--text-dim);
  }
  .btn-save {
    background: var(--accent);
    color: var(--bg);
    font-weight: 500;
  }

  .model-select {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    color: var(--text);
    font-family: var(--font);
    font-size: 13px;
    outline: none;
    margin-bottom: 4px;
    appearance: none;
    cursor: pointer;
  }
  .model-select:focus { border-color: var(--accent-dim); }
  .field-label {
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 6px;
    display: block;
  }
  .field-group { margin-bottom: 14px; }

  /* Welcome */
  .welcome {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex: 1;
    padding: 32px;
    text-align: center;
    color: var(--text-dim);
    gap: 8px;
  }
  .welcome-icon {
    font-size: 28px;
    margin-bottom: 4px;
    opacity: 0.6;
  }
  .welcome h2 {
    font-size: 17px;
    font-weight: 500;
    color: var(--text);
  }
  .welcome p {
    font-size: 13px;
    max-width: 340px;
  }

  /* Mobile */
  @media (max-width: 600px) {
    .app { max-width: 100%; }
    .msg { max-width: 92%; font-size: 13.5px; }
  }

  /* Safe area (iOS) */
  .input-area {
    padding-bottom: max(12px, env(safe-area-inset-bottom));
  }
</style>
</head>
<body>
<div id="root"></div>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.9/babel.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/marked/15.0.7/marked.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.2.4/purify.min.js"></script>
<script type="text/babel">
const { useState, useRef, useEffect, useCallback } = React;

const SYSTEM_PROMPT = `You are a clinical assistant for a specialist physician in nephrology and critical care medicine working in a Korean ICU.
The user is a board-certified specialist — respond at expert level.
Language: Korean preferred, English medical terms are fine.
Be concise and direct. Skip generic "consult your doctor" disclaimers — the user IS the doctor. But clearly flag when evidence is limited, when you are uncertain, or when guidelines conflict.
Answer only what is asked. Do not add unrequested considerations (e.g. do not mention CRRT, renal adjustment, or special populations unless the user asks).`;

const MODELS = [
  { id: 'claude-sonnet-4-20250514', label: 'Sonnet 4', costIn: 3, costOut: 15 },
  { id: 'claude-opus-4-6', label: 'Opus 4.6', costIn: 5, costOut: 25 },
  { id: 'claude-haiku-4-5-20251001', label: 'Haiku 4.5', costIn: 1, costOut: 5 },
];

function renderMarkdown(text) {
  const html = marked.parse(text, { breaks: true, gfm: true });
  return DOMPurify.sanitize(html);
}

function App() {
  const [messages, setMessages] = useState([]);
  const [input, setInput] = useState('');
  const [loading, setLoading] = useState(false);
  const [showSettings, setShowSettings] = useState(false);
  const [apiKey, setApiKey] = useState(() => localStorage.getItem('cq_api_key') || '');
  const [model, setModel] = useState(() => localStorage.getItem('cq_model') || MODELS[0].id);
  const [tokenCount, setTokenCount] = useState({ input: 0, output: 0 });
  const messagesRef = useRef(null);
  const textareaRef = useRef(null);
  const tempKeyRef = useRef('');
  const tempModelRef = useRef('');

  const scrollToBottom = useCallback(() => {
    if (messagesRef.current) {
      messagesRef.current.scrollTop = messagesRef.current.scrollHeight;
    }
  }, []);

  useEffect(() => { scrollToBottom(); }, [messages, loading, scrollToBottom]);

  useEffect(() => {
    if (!apiKey) setShowSettings(true);
  }, []);

  const autoResize = (el) => {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 160) + 'px';
  };

  const handleSend = async () => {
    const text = input.trim();
    if (!text || loading || !apiKey) return;

    const userMsg = { role: 'user', content: text };
    const newMessages = [...messages, userMsg];
    setMessages(newMessages);
    setInput('');
    if (textareaRef.current) {
      textareaRef.current.style.height = 'auto';
    }
    setLoading(true);

    try {
      const apiMessages = newMessages.map(m => ({
        role: m.role,
        content: m.content
      }));

      const res = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-api-key': apiKey,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true',
        },
        body: JSON.stringify({
          model,
          max_tokens: 4096,
          system: SYSTEM_PROMPT,
          messages: apiMessages,
        }),
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.error?.message || `API error ${res.status}`);
      }

      const data = await res.json();
      const assistantText = data.content
        .filter(b => b.type === 'text')
        .map(b => b.text)
        .join('');

      setMessages(prev => [...prev, { role: 'assistant', content: assistantText }]);

      if (data.usage) {
        setTokenCount(prev => ({
          input: prev.input + data.usage.input_tokens,
          output: prev.output + data.usage.output_tokens,
        }));
      }
    } catch (err) {
      setMessages(prev => [...prev, { role: 'error', content: err.message }]);
    } finally {
      setLoading(false);
    }
  };

  const handleKeyDown = (e) => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
      e.preventDefault();
      handleSend();
    }
  };

  const clearChat = () => {
    setMessages([]);
    setTokenCount({ input: 0, output: 0 });
  };

  const saveSettings = () => {
    const key = tempKeyRef.current || apiKey;
    const mod = tempModelRef.current || model;
    setApiKey(key);
    setModel(mod);
    localStorage.setItem('cq_api_key', key);
    localStorage.setItem('cq_model', mod);
    setShowSettings(false);
  };

  const openSettings = () => {
    tempKeyRef.current = apiKey;
    tempModelRef.current = model;
    setShowSettings(true);
  };

  const currentModel = MODELS.find(m => m.id === model) || MODELS[0];
  const estCost = (
    (tokenCount.input / 1e6) * currentModel.costIn +
    (tokenCount.output / 1e6) * currentModel.costOut
  ).toFixed(4);

  return (
    <div className="app">
      <div className="header">
        <div className="header-title">
          Clinical <span>Q&A</span>
        </div>
        <div className="header-actions">
          <span style={{ fontSize: '11px', color: 'var(--text-muted)', fontFamily: 'var(--mono)' }}>
            {currentModel.label}
          </span>
          <div className={`key-status ${apiKey ? 'active' : ''}`} title={apiKey ? 'API key set' : 'No API key'} />
          <button className="header-btn" onClick={clearChat}>Clear</button>
          <button className="header-btn" onClick={openSettings}>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          </button>
        </div>
      </div>

      {messages.length === 0 && !loading ? (
        <div className="welcome">
          <div className="welcome-icon">🩺</div>
          <h2>Clinical Q&A</h2>
          <p>Nephrology & Critical Care<br/>빠른 임상 질문용. 간결하게 답변합니다.</p>
        </div>
      ) : (
        <div className="messages" ref={messagesRef}>
          {messages.map((msg, i) => (
            <div key={i} className={`msg ${msg.role}`}>
              {msg.role === 'assistant' ? (
                <div dangerouslySetInnerHTML={{ __html: renderMarkdown(msg.content) }} />
              ) : (
                msg.content
              )}
            </div>
          ))}
          {loading && (
            <div className="typing">
              <span /><span /><span />
            </div>
          )}
        </div>
      )}

      <div className="input-area">
        <div className="input-row">
          <textarea
            ref={textareaRef}
            rows={1}
            value={input}
            onChange={e => { setInput(e.target.value); autoResize(e.target); }}
            onKeyDown={handleKeyDown}
            placeholder="질문을 입력하세요..."
            disabled={loading}
          />
          <button className="send-btn" onClick={handleSend} disabled={!input.trim() || loading || !apiKey}>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
              <line x1="22" y1="2" x2="11" y2="13" />
              <polygon points="22 2 15 22 11 13 2 9 22 2" />
            </svg>
          </button>
        </div>
        {(tokenCount.input > 0 || tokenCount.output > 0) && (
          <div className="token-info">
            {tokenCount.input.toLocaleString()}↓ {tokenCount.output.toLocaleString()}↑ ≈ ${estCost}
          </div>
        )}
      </div>

      {showSettings && (
        <div className="modal-overlay" onClick={(e) => { if (e.target === e.currentTarget && apiKey) setShowSettings(false); }}>
          <div className="modal">
            <h3>Settings</h3>
            <p>API key는 브라우저 localStorage에만 저장됩니다.</p>
            <div className="field-group">
              <label className="field-label">Anthropic API Key</label>
              <input
                type="password"
                defaultValue={apiKey}
                onChange={e => tempKeyRef.current = e.target.value}
                placeholder="sk-ant-..."
                autoFocus
              />
            </div>
            <div className="field-group">
              <label className="field-label">Model</label>
              <select
                className="model-select"
                defaultValue={model}
                onChange={e => tempModelRef.current = e.target.value}
              >
                {MODELS.map(m => (
                  <option key={m.id} value={m.id}>
                    {m.label} — ${m.costIn}/${ m.costOut} per M tokens
                  </option>
                ))}
              </select>
            </div>
            <div className="modal-actions">
              {apiKey && <button className="btn-cancel" onClick={() => setShowSettings(false)}>Cancel</button>}
              <button className="btn-save" onClick={saveSettings}>Save</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
